# SPDX-License-Identifier: BSD-2-Clause
name: Source checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Source integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.7'
      - name: Check the squash commit title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python3 - <<'PY'
          import os
          import re
          title = os.environ['PR_TITLE']
          pattern = r'(feat|fix|docs|test|refactor|perf|build|ci|chore|revert)(\([a-zA-Z0-9_./-]+\))?!?: \S.*'
          if len(title) > 72 or not re.fullmatch(pattern, title):
              raise SystemExit('Use a type(scope): summary title, at most72 characters.')
          PY
      - name: Verify public source integrity
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python3 --version
          python3 - <<'PYTHON'
          import ast
          import hashlib
          import json
          import pathlib
          import subprocess

          root = pathlib.Path.cwd()
          bundle = root / '.agent-temper'
          expected = {'SOURCE.md', 'SHA256SUMS'}
          for row in (bundle / 'SHA256SUMS').read_text().splitlines():
              digest, name = row.split('  ', 1)
              path = pathlib.PurePosixPath(name)
              if path.is_absolute() or '..' in path.parts:
                  raise SystemExit('Unsafe method manifest path')
              expected.add(name)
              actual = hashlib.sha256((bundle / name).read_bytes()).hexdigest()
              if actual != digest:
                  raise SystemExit('Changed method file: ' + name)
          actual = {str(p.relative_to(bundle)) for p in bundle.rglob('*') if p.is_file()}
          if actual != expected or any(p.is_symlink() for p in bundle.rglob('*')):
              raise SystemExit('Method inventory mismatch')
          for name in ('scripts/deps.py', 'scripts/check_workflow.py'):
              ast.parse((root / name).read_text(), filename=name)
          json.loads((root / 'docs/workflow.json').read_text())
          names = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          for name in filter(None, names):
              parts = pathlib.PurePosixPath(name).parts
              if (pathlib.PurePosixPath(name).name in {
                      'check-standards.py', 'check-distribution.py', 'check-experience.py',
                      'standards.lock', 'distribution.lock', 'experience.lock'}
                      or '.githooks' in parts or 'standards-review' in parts
                      or any(p.startswith(('aether-standards', 'aether-experience',
                                           'aether-distribution', 'aether-foundations',
                                           'aether-approved-drafts',
                                           'aether-review-snapshots')) for p in parts)):
                  raise SystemExit('Private publication path: ' + name)
          print('PASS: method bundle, selected Python syntax, JSON and publication paths')
          PYTHON
          git diff --exit-code

      - name: Exercise AF09 host decoders and checker controller
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s tests -p test_af09_drain_trace.py -v
          python3 -B userland/experiments/filesystem-service/fd_home_drain_checks_tests.py
          git diff --exit-code

  kernel-models:
    name: Kernel models
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Acquire checksum-pinned Zig host tool
        env:
          ZIG_SHA256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/zig-0.16.0.tar.xz"
          curl --fail --show-error --silent --location --proto '=https' --tlsv1.2 \
            --max-time 120 --output "$archive" \
            https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
          echo "$ZIG_SHA256  $archive" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/zig"
          tar -xJf "$archive" --strip-components=1 -C "$RUNNER_TEMP/zig"
          rm "$archive"
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
      - name: Exercise bounded kernel models
        run: |
          set -euo pipefail
          test "$(zig version)" = 0.16.0
          for source in kernel/capability.zig kernel/lifetime.zig kernel/native_elf.zig kernel/native_launch.zig; do
            timeout 180 zig test "$source" \
              --cache-dir "$RUNNER_TEMP/zig-cache" \
              --global-cache-dir "$RUNNER_TEMP/zig-global-cache" 2>&1 | tee "$RUNNER_TEMP/kernel-model.log"
            grep -Eq '^All [1-9][0-9]* tests? passed\.$' "$RUNNER_TEMP/kernel-model.log"
          done
          git diff --exit-code
